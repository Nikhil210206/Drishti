<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Allow the microphone for Drishti</title>
    <style>
      body { font: 20px/1.6 system-ui, sans-serif; margin: 40px; max-width: 40em; }
      button { font-size: 20px; padding: 12px 20px; margin-top: 16px; }

    <button id="again" hidden>Ask again</button>
    <script type="module" src="./main.ts"></script>
  </body>
