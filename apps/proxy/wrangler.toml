# Drishti proxy. Setup and deploy steps: docs/proxy.md.
name = "drishti-proxy"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Nothing is logged: no request bodies, no URLs with tokens (sockets carry the token as a subprotocol).
[observability]
enabled = false

[vars]
DAILY_UNITS = "400"
# The website's connect page mints tokens from the browser: the only origin that gets CORS.
# Local development overrides it in .dev.vars (WEBSITE_ORIGINS=http://localhost:5175).
WEBSITE_ORIGINS = "https://drishti-voice.pages.dev"

# Per-device daily usage (created 2026-10-08, APAC). Schema: `npx wrangler d1 execute drishti-quota --remote --file=schema.sql`.
[[d1_databases]]
binding = "DB"
database_name = "drishti-quota"
database_id = "9292c758-e6c2-43a6-87d0-9b684bc589dc"

# Sarvam's starter plan allows 40 LLM calls a minute, shared by every user.
[[ratelimits]]
name = "GLOBAL_LLM"
namespace_id = "1001"
simple = { limit = 40, period = 60 }

[[ratelimits]]
name = "DEVICE_LIMIT"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "MINT_LIMIT"
namespace_id = "1003"
simple = { limit = 5, period = 60 }

# Secrets (never in this file): wrangler secret put SARVAM_API_KEY / TOKEN_SECRET / TURNSTILE_SECRET
