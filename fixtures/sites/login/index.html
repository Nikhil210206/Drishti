<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pathik Rail — Log in</title>
    <style>
      body { font: 16px/1.5 sans-serif; max-width: 420px; margin: 40px auto; }
      label { display: block; margin-top: 12px; }
      input { width: 100%; padding: 8px; font-size: 16px; }
      button { margin-top: 16px; padding: 10px 16px; font-size: 16px; }
    </style>
  </head>
  <body>
    <h1>Log in to Pathik Rail</h1>
    <form onsubmit="event.preventDefault(); document.getElementById('msg').textContent = 'Logged in (demo).';">
      <label for="u">Mobile number or email</label><input id="u" name="username" autocomplete="username" />
      <label for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password" />
      <label for="o">OTP sent to your mobile</label><input id="o" name="otp" autocomplete="one-time-code" inputmode="numeric" />
      <button type="submit">Log in</button>
    </form>
    <p id="msg" role="status"></p>
    <p><em>Fictional demo page for the Drishti eval.</em></p>
  </body>
</html>
