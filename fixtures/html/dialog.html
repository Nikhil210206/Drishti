<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dialog fixture</title>
  </head>
  <body>
    <h1>Page behind</h1>
    <button>Behind button</button>
    <div role="dialog" aria-label="Choose date" style="position: fixed; inset: 20px; background: white">
      <p>Pick a day</p>
      <button>Today</button>
      <button>Tomorrow</button>
    </div>
  </body>
</html>
