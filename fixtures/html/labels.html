<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Labels fixture</title>
    <style>
      .icon { display: inline-block; width: 28px; height: 28px; cursor: pointer; background: #eee; }
      .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
      .lbl { font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>Book a ticket</h1>
    <!-- Unlabelled icon buttons: names come from their classes -->
    <div class="icon fa fa-search" id="s"></div>
    <div class="icon btn-cart-icon"></div>
    <!-- Field with only a visual label next to it -->
    <div class="row"><div class="lbl">Age</div><input id="age" /></div>
    <!-- Properly labelled controls -->
    <label for="nm">Passenger name</label><input id="nm" />
    <button aria-label="Close dialog">x</button>
    <input type="password" name="pwd" placeholder="Password" />
    <!-- Colour-only status -->
    <p><span class="dot" style="background: rgb(30, 160, 70)"></span> 12 seats</p>
    <p><span class="dot" style="background: rgb(220, 40, 40)"></span> Waiting list</p>
    <!-- Hidden things are not part of the page model -->
    <button style="display: none">Hidden pay</button>
    <div aria-hidden="true"><button>Decorative</button></div>
    <!-- Custom widget selection state -->
    <div class="icon chip active" role="radio">Sleeper</div>
    <a href="/docs/bill.pdf">Electricity bill (PDF)</a>
    <iframe srcdoc="<button>Inside frame</button>" style="width: 200px; height: 60px"></iframe>
  </body>
</html>
