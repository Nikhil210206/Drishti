# Pathik Rail tasks. `answers` are the scripted user's replies to ask_user, in order.
- id: book-hi-sleeper
  lang: hi-IN
  command: "कल चेन्नई से बेंगलुरु की स्लीपर क्लास की एक टिकट बुक करो, मेरे लिए"
