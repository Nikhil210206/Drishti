name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Install Chromium for page-model tests
        run: npx playwright install --with-deps chromium
      - name: Unit tests
        run: npm test
      - name: Agent eval (replayed from cassettes, no API calls)
        run: npm run eval -- --ci
      - name: Build extension
        run: npm run build -w @drishti/extension
      - name: Agent eval through the extension's ExtensionDriver (replayed, no API calls)
        run: npm run eval:extension -- --ci
      # What users get when the debugger can't attach (they dismissed Chrome's debugging bar,
      # DevTools is open): synthetic events only.
      - name: Agent eval through the extension, synthetic input only (replayed, no API calls)
        run: npm run eval:extension -- --ci --input=synthetic
      - name: Upload eval traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-traces
          path: eval/runs/
          retention-days: 14
      - name: Build panel
        run: npm run build -w @drishti/ui
